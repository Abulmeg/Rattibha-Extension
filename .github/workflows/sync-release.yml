name: Import release source

on:
  push:
    branches: [main]
    paths:
      - "Rattibha-Learn-GitHub-Source-v0.11.0.zip"
      - ".sync/source.tar.xz"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Import release files
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib
          import tarfile
          import zipfile

          compressed = Path(".sync/source.tar.xz")
          zipped = Path("Rattibha-Learn-GitHub-Source-v0.11.0.zip")

          def destination_for(name):
              relative = PurePosixPath(name)
              if not name or relative.is_absolute() or ".." in relative.parts:
                  raise SystemExit(f"Unsafe archive entry: {name}")
              return Path(*relative.parts)

          if compressed.exists():
              digest = hashlib.sha256(compressed.read_bytes()).hexdigest()
              expected = "8a2a26e745a53b1c587e3ad5ce3fb4f80d86dcd5ed131a1ce24fd6c74043e825"
              if digest != expected:
                  raise SystemExit("Source archive checksum mismatch")
              with tarfile.open(compressed, "r:xz") as archive:
                  for item in archive:
                      if item.isdir():
                          continue
                      if not item.isfile():
                          raise SystemExit(f"Unsupported archive entry: {item.name}")
                      dest = destination_for(item.name)
                      dest.parent.mkdir(parents=True, exist_ok=True)
                      handle = archive.extractfile(item)
                      if handle is None:
                          raise SystemExit(f"Unreadable archive entry: {item.name}")
                      dest.write_bytes(handle.read())
              compressed.unlink()
              compressed.parent.rmdir()
          elif zipped.exists():
              with zipfile.ZipFile(zipped) as archive:
                  for item in archive.infolist():
                      if item.is_dir():
                          continue
                      dest = destination_for(item.filename)
                      dest.parent.mkdir(parents=True, exist_ok=True)
                      dest.write_bytes(archive.read(item))
              zipped.unlink()
          else:
              raise SystemExit("No source archive found")
          PY

      - name: Check extension files
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path("manifest.json").read_text())
          assert m["manifest_version"] == 3
          assert m["version"] == "0.11.0"
          required = ["content.js", "styles.css", "file-tools.js", "pdf-generator.js", "background.js", "popup.js", "vendor/jszip.min.js"]
          for name in required:
              assert Path(name).is_file(), f"Missing {name}"
          PY
          node --check content.js
          node --check background.js
          node --check file-tools.js
          node --check pdf-generator.js
          node --check popup.js
          node --check preflight.js

      - name: Commit imported source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Sync extension source to v0.11.0"
            git push origin HEAD:main
          fi
